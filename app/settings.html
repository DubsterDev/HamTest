{{header}}
    <main>
        <h1>Settings</h1>
        <p class="settingsLabel">Study mode</p>
        <label class="settingsContainer">
            <div>
                <h2>Auto select correct answers</h2>
                <p>Makes the correct answer A on new questions</p>
            </div>
            <div class="toggle">
                <input type="checkbox" name="autoSelectCorrectAnswer" id="autoSelectCorrectAnswer">
                <span class="slider"></span>
            </div>
        </label>
        <p class="settingsLabel">Data management</p>
        <div class="settingsContainer top" id="exportProgressButton">
            <div>
                <h2>Export progress</h2>
                <p>Export your progress to a file</p>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentcolor" viewBox="0 -960 960 960"><path d="M480-315.33 284.67-510.67l47.33-48L446.67-444v-356h66.66v356L628-558.67l47.33 48zM226.67-160q-27 0-46.84-19.83Q160-199.67 160-226.67V-362h66.67v135.33h506.66V-362H800v135.33q0 27-19.83 46.84Q760.33-160 733.33-160z"/></svg>
        </div>
        <div class="settingsContainer bottom" id="importProgressButton">
            <div>
                <h2>Import progress</h2>
                <p>Import your progress from a file</p>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentcolor" viewBox="0 -960 960 960"><path d="M446.67-315.33v-356L332-556.67l-47.33-48L480-800l195.33 195.33-47.33 48-114.67-114.66v356zM226.67-160q-27 0-46.84-19.83Q160-199.67 160-226.67V-362h66.67v135.33h506.66V-362H800v135.33q0 27-19.83 46.84Q760.33-160 733.33-160z"/></svg>
        </div>
        <p class="settingsLabel">About Ham Test</p>
        <a class="settingsContainer top" href="https://github.com/DubsterDev/HamTest" target="_blank">
            <div>
                <h2>Open source</h2>
                <p>Ham Test is open source on GitHub under the GPLv3 license</p>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentcolor" viewBox="0 -960 960 960"><path d="M186.67-120q-27 0-46.84-19.83Q120-159.67 120-186.67v-586.66q0-27 19.83-46.84Q159.67-840 186.67-840H466v66.67H186.67v586.66h586.66V-466H840v279.33q0 27-19.83 46.84Q800.33-120 773.33-120zM384-336.67 337.33-384l389.34-389.33h-194V-840H840v307.33h-66.67V-726z"/></svg>
        </a>
        <div class="settingsContainer bottom">
            <div>
                <h2>Version</h2>
                <p>1.2.0</p>
            </div>
        </div>
    </main>
    <script src="/assets/scripts/storageMigration.js"></script>
    <script src="/assets/scripts/settings.js"></script>
{{footer}}
